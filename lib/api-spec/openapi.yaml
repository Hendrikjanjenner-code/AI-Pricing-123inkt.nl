openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Pricing Decision Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product/SKU management
  - name: categories
    description: Category management
  - name: recommendations
    description: Pricing recommendations
  - name: dashboard
    description: Dashboard KPIs and charts
  - name: uploads
    description: CSV data uploads
  - name: data-quality
    description: Data quality checks
  - name: substitutions
    description: Substitution monitoring
  - name: model-health
    description: Model health and runs
  - name: exports
    description: Export functionality
  - name: users
    description: User management
  - name: skus
    description: SKU deep dive
  - name: signals
    description: Intelligence Signals (gestandaardiseerde engine-signalen)
  - name: shops
    description: Shop dimension (multi-shop)
  - name: competition
    description: Competition Intelligence (concurrentscores & rankings)
  - name: copilot
    description: Commercial AI Copilot (AI Gateway)

paths:
  # PRINTERWORKFLOW PATHS BEGIN
  /channelmanager/printer/{shop_id}:
    get:
      tags:
      - printer-workflow
      summary: Overview
      operationId: printerWorkflowOverview
      security:
      - HTTPBearer: []
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: integer
          title: Shop Id
      - name: before_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Before Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterWorkflowHTTPValidationError'

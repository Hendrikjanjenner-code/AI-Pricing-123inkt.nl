                  items_with_room: { type: integer }
                  boundary_competitors:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  volume_known: { type: boolean }
                  total_uplift_estimate_30d: { type: ["number", "null"] }
                  as_of_min: { type: ["string", "null"] }
                  as_of_max: { type: ["string", "null"] }
                  total_items_with_room: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /competition/landscape:
    get:
      operationId: getCompetitorLandscape

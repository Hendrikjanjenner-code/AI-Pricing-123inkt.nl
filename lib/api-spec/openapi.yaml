openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Pricing Decision Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product/SKU management
  - name: categories
    description: Category management
  - name: recommendations
    description: Pricing recommendations
  - name: dashboard
    description: Dashboard KPIs and charts
  - name: uploads
    description: CSV data uploads
  - name: data-quality
    description: Data quality checks
  - name: substitutions
    description: Substitution monitoring
  - name: model-health
    description: Model health and runs
  - name: exports
    description: Export functionality
  - name: users
    description: User management
  - name: skus
    description: SKU deep dive

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/charts/margin-by-category:
    get:
      operationId: getMarginByCategory
      tags: [dashboard]
      summary: Margin uplift grouped by category
      responses:
        "200":
          description: Margin by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryMarginItem"

  /dashboard/charts/recs-by-strategy:
    get:
      operationId: getRecsByStrategy
      tags: [dashboard]
      summary: Recommendation count by strategy type
      responses:
        "200":
          description: Recs by strategy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyCountItem"

  /dashboard/charts/confidence-distribution:
    get:
      operationId: getConfidenceDistribution
      tags: [dashboard]
      summary: Confidence score distribution
      responses:
        "200":
          description: Confidence distribution buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfidenceBucket"

  /dashboard/charts/price-change-distribution:
    get:
      operationId: getPriceChangeDistribution
      tags: [dashboard]
      summary: Price change % distribution
      responses:
        "200":
          description: Price change distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceChangeBucket"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products/SKUs
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: strategy_type
          in: query
          schema:
            type: ["string", "null"]
        - name: lifecycle_status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: page_size
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /category-strategies:
    get:
      operationId: listCategoryStrategies
      tags: [categories]
      summary: List category-strategy mappings
      responses:
        "200":
          description: Category strategy mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStrategy"

  /category-strategies/{id}:
    put:
      operationId: updateCategoryStrategy
      tags: [categories]
      summary: Update category strategy mapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryStrategyRequest"
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryStrategy"

  /recommendations:
    get:
      operationId: listRecommendations
      tags: [recommendations]
      summary: List pricing recommendations
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: strategy_type
          in: query
          schema:
            type: ["string", "null"]
        - name: approval_status
          in: query
          schema:
            type: ["string", "null"]
        - name: safety_status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: page_size
          in: query
          schema:
            type: ["integer", "null"]
        - name: sort_by
          in: query
          schema:
            type: ["string", "null"]
        - name: sort_dir
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Recommendation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationListResponse"

  /recommendations/{id}:
    get:
      operationId: getRecommendation
      tags: [recommendations]
      summary: Get recommendation detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommendation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recommendations/{id}/approve:
    post:
      operationId: approveRecommendation
      tags: [recommendations]
      summary: Approve a recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /recommendations/{id}/reject:
    post:
      operationId: rejectRecommendation
      tags: [recommendations]
      summary: Reject a recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Rejected recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /recommendations/{id}/override:
    patch:
      operationId: overrideRecommendation
      tags: [recommendations]
      summary: Manually override recommended price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideRequest"
      responses:
        "200":
          description: Overridden recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /recommendations/bulk-approve:
    post:
      operationId: bulkApproveRecommendations
      tags: [recommendations]
      summary: Bulk approve recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIdsRequest"
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /model-runs:
    get:
      operationId: listModelRuns
      tags: [model-health]
      summary: List model runs
      responses:
        "200":
          description: Model run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelRun"

    post:
      operationId: triggerModelRun
      tags: [model-health]
      summary: Trigger a new model run
      responses:
        "200":
          description: Model run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRun"

  /model-health:
    get:
      operationId: getModelHealth
      tags: [model-health]
      summary: Get model health summary
      responses:
        "200":
          description: Model health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelHealth"

  /data-quality:
    get:
      operationId: getDataQuality
      tags: [data-quality]
      summary: Get data quality report
      responses:
        "200":
          description: Data quality issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityReport"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List import jobs
      responses:
        "200":
          description: Import jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportJob"

  /uploads/products:
    post:
      operationId: uploadProducts
      tags: [uploads]
      summary: Upload product master CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/sales:
    post:
      operationId: uploadSales
      tags: [uploads]
      summary: Upload sales history CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/prices:
    post:
      operationId: uploadPrices
      tags: [uploads]
      summary: Upload own price history CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/competitor-prices:
    post:
      operationId: uploadCompetitorPrices
      tags: [uploads]
      summary: Upload competitor prices CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/inventory:
    post:
      operationId: uploadInventory
      tags: [uploads]
      summary: Upload inventory/stock CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/substitutions:
    post:
      operationId: uploadSubstitutions
      tags: [uploads]
      summary: Upload substitution mapping CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/basket-affinity:
    post:
      operationId: uploadBasketAffinity
      tags: [uploads]
      summary: Upload basket affinity CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/price-rules:
    post:
      operationId: uploadPriceRules
      tags: [uploads]
      summary: Upload min/max price rules CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /substitutions:
    get:
      operationId: listSubstitutions
      tags: [substitutions]
      summary: List A-brand/private-label substitution pairs
      responses:
        "200":
          description: Substitution pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubstitutionPair"

  /skus/{id}/history:
    get:
      operationId: getSkuHistory
      tags: [skus]
      summary: Get SKU historical data for deep dive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SKU history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuHistory"

  /exports/recommendations:
    get:
      operationId: exportRecommendations
      tags: [exports]
      summary: Export approved recommendations as CSV (prijsexport)
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: CSV export metadata/confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [admin, pricing_manager, analyst, viewer]
        is_active:
          type: boolean
        created_at:
          type: string
      required: [id, username, email, role, is_active]

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, pricing_manager, analyst, viewer]
      required: [username, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: ["string", "null"]
        full_name:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        is_active:
          type: ["boolean", "null"]

    Product:
      type: object
      properties:
        sku_id:
          type: string
        product_name:
          type: string
        brand:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        subcategory:
          type: ["string", "null"]
        product_group:
          type: ["string", "null"]
        is_private_label:
          type: boolean
        is_a_brand:
          type: boolean
        lifecycle_status:
          type: ["string", "null"]
          enum: ["active", "end_of_life", "clearance", "new", null]
        strategy_type:
          type: ["string", "null"]
          enum: ["SUBSTITUTION_PORTFOLIO", "COMPETITOR_INDEX", "MARGIN_OPTIMIZATION", "STOCK_CLEARANCE", "BASKET_BUILDER", "VOLUME_DISCOUNT", "REPEAT_PURCHASE", "LOW_VELOCITY", null]
        cost_price:
          type: ["number", "null"]
        min_price:
          type: ["number", "null"]
        max_price:
          type: ["number", "null"]
        current_price:
          type: ["number", "null"]
        stock_quantity:
          type: ["integer", "null"]
        data_quality_score:
          type: ["number", "null"]
      required: [sku_id, product_name, is_private_label, is_a_brand]

    ProductListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
      required: [items, total, page, page_size]

    UpdateProductRequest:
      type: object
      properties:
        strategy_type:
          type: ["string", "null"]
        lifecycle_status:
          type: ["string", "null"]
        min_price:
          type: ["number", "null"]
        max_price:
          type: ["number", "null"]
        cost_price:
          type: ["number", "null"]

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parent_category:
          type: ["string", "null"]
        default_strategy:
          type: ["string", "null"]
        sku_count:
          type: integer
      required: [id, name, sku_count]

    CategoryStrategy:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
        subcategory:
          type: ["string", "null"]
        strategy_type:
          type: string
        notes:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]
        updated_by:
          type: ["string", "null"]
      required: [id, category, strategy_type]

    UpdateCategoryStrategyRequest:
      type: object
      properties:
        strategy_type:
          type: string
        notes:
          type: ["string", "null"]
      required: [strategy_type]

    Recommendation:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        sku_id:
          type: string
        product_name:
          type: string
        category:
          type: ["string", "null"]
        strategy_type:
          type: ["string", "null"]
        current_price:
          type: ["number", "null"]
        recommended_price:
          type: ["number", "null"]
        recommended_change_pct:
          type: ["number", "null"]
        expected_units:
          type: ["number", "null"]
        expected_revenue:
          type: ["number", "null"]
        expected_margin:
          type: ["number", "null"]
        expected_margin_uplift:
          type: ["number", "null"]
        confidence_score:
          type: ["number", "null"]
        reason_code:
          type: ["string", "null"]
        safety_status:
          type: ["string", "null"]
          enum: ["ok", "warning", "blocked", null]
        approval_status:
          type: ["string", "null"]
          enum: ["pending", "approved", "rejected", "overridden", null]
        approved_by:
          type: ["string", "null"]
        exported:
          type: boolean
        model_version:
          type: ["string", "null"]
      required: [id, date, sku_id, product_name, exported]

    RecommendationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pending_count:
          type: integer
        approved_count:
          type: integer
        rejected_count:
          type: integer
      required: [items, total, page, page_size, pending_count, approved_count, rejected_count]

    RecommendationDetail:
      type: object
      properties:
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        product:
          $ref: "#/components/schemas/Product"
        competitor_prices:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorPrice"
        input_factors:
          type: object

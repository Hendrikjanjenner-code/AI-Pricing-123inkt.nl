components:
  parameters:
    CostPriorityShopId:
      name: shop_id
      in: path
      required: true
      schema: {type: integer}
  schemas:
    # PRINTERWORKFLOW SCHEMAS BEGIN
    PrinterWorkflowAdviceInput:
      properties:
        notes:
          type: string
          maxLength: 2000
          minLength: 1
          title: Notes
        profile_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Profile Id
        version_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Version Id
        semantics_confirmed:
          type: boolean
          title: Semantics Confirmed
          default: false
      additionalProperties: false
      type: object
      required:
      - notes
      - profile_id
      - version_id
      title: AdviceInput
    PrinterWorkflowApproveInput:
      properties:
        notes:
          type: string
          maxLength: 2000
          minLength: 1
          title: Notes
        acknowledge_warnings:
          type: boolean
          title: Acknowledge Warnings
          default: false
      additionalProperties: false
      type: object
      required:
      - notes
      title: ApproveInput
    PrinterWorkflowCalculateInput:
      properties:
        notes:
          type: string
          maxLength: 2000
          minLength: 1
          title: Notes
        advice_snapshot_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Advice Snapshot Id
      additionalProperties: false
      type: object
      required:
      - notes
      - advice_snapshot_id
      title: CalculateInput
    PrinterWorkflowConditionalRule:
      properties:
        threshold:
          type: string
          title: Threshold
          default: '50'
        lower_offset:
          type: string
          title: Lower Offset
        upper_offset:
          type: string
          title: Upper Offset
        multiplier:
          type: string
          title: Multiplier
          default: '1'
        round_inner_integer:
          type: boolean
          title: Round Inner Integer
          default: false
        lower_tail:
          type: string
          title: Lower Tail
          default: '0'
        upper_tail:
          type: string
          title: Upper Tail
          default: '0'
      additionalProperties: false
      type: object
      required:
      - lower_offset
      - upper_offset
      title: ConditionalRule
    PrinterWorkflowConfigInput:
      properties:
        notes:
          type: string
          maxLength: 2000
          minLength: 1
          title: Notes
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        config:
          $ref: '#/components/schemas/PrinterWorkflowPrinterConfig'
      additionalProperties: false
      type: object
      required:
      - notes
      - expected_revision
      - config
      title: ConfigInput
    PrinterWorkflowHTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/PrinterWorkflowValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PrinterWorkflowNotes:
      properties:
        notes:
          type: string
          maxLength: 2000
          minLength: 1
          title: Notes
      additionalProperties: false
      type: object
      required:
      - notes
      title: Notes
    PrinterWorkflowPriceRow:
      properties:
        sku:
          type: string
          maxLength: 500
          minLength: 1
          title: Sku
        shop_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Shop Id
        price:
          type: string
          title: Price
      additionalProperties: false
      type: object
      required:
      - sku
      - shop_id
      - price
      title: PriceRow
    PrinterWorkflowPricesInput:
      properties:
        notes:
          type: string
          maxLength: 2000
          minLength: 1
          title: Notes
        rows:
          items:
            $ref: '#/components/schemas/PrinterWorkflowPriceRow'

openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Pricing Decision Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product/SKU management
  - name: categories
    description: Category management
  - name: recommendations
    description: Pricing recommendations
  - name: dashboard
    description: Dashboard KPIs and charts
  - name: uploads
    description: CSV data uploads
  - name: data-quality
    description: Data quality checks
  - name: substitutions
    description: Substitution monitoring
  - name: model-health
    description: Model health and runs
  - name: exports
    description: Export functionality
  - name: users
    description: User management
  - name: skus
    description: SKU deep dive
  - name: signals
    description: Intelligence Signals (gestandaardiseerde engine-signalen)
  - name: shops
    description: Shop dimension (multi-shop)
  - name: copilot
    description: Commercial AI Copilot (AI Gateway)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/charts/margin-by-category:
    get:
      operationId: getMarginByCategory
      tags: [dashboard]
      summary: Margin uplift grouped by category
      responses:
        "200":
          description: Margin by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryMarginItem"

  /dashboard/charts/recs-by-strategy:
    get:
      operationId: getRecsByStrategy
      tags: [dashboard]
      summary: Recommendation count by strategy type
      responses:
        "200":
          description: Recs by strategy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategyCountItem"

  /dashboard/charts/confidence-distribution:
    get:
      operationId: getConfidenceDistribution
      tags: [dashboard]
      summary: Confidence score distribution
      responses:
        "200":
          description: Confidence distribution buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfidenceBucket"

  /dashboard/charts/price-change-distribution:
    get:
      operationId: getPriceChangeDistribution
      tags: [dashboard]
      summary: Price change % distribution
      responses:
        "200":
          description: Price change distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceChangeBucket"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products/SKUs
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: subcategory
          in: query
          schema:
            type: ["string", "null"]
        - name: is_private_label
          in: query
          schema:
            type: ["boolean", "null"]
        - name: strategy_type
          in: query
          schema:
            type: ["string", "null"]
        - name: lifecycle_status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: page_size
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /category-strategies:
    get:
      operationId: listCategoryStrategies
      tags: [categories]
      summary: List category-strategy mappings
      responses:
        "200":
          description: Category strategy mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStrategy"

  /category-strategies/{id}:
    put:
      operationId: updateCategoryStrategy
      tags: [categories]
      summary: Update category strategy mapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryStrategyRequest"
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryStrategy"

  /recommendations:
    get:
      operationId: listRecommendations
      tags: [recommendations]
      summary: List pricing recommendations
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: strategy_type
          in: query
          schema:
            type: ["string", "null"]
        - name: approval_status
          in: query
          schema:
            type: ["string", "null"]
        - name: safety_status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: page_size
          in: query
          schema:
            type: ["integer", "null"]
        - name: sort_by
          in: query
          schema:
            type: ["string", "null"]
        - name: sort_dir
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Recommendation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationListResponse"

  /recommendations/{id}:
    get:
      operationId: getRecommendation
      tags: [recommendations]
      summary: Get recommendation detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recommendation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recommendations/{id}/approve:
    post:
      operationId: approveRecommendation
      tags: [recommendations]
      summary: Approve a recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /recommendations/{id}/reject:
    post:
      operationId: rejectRecommendation
      tags: [recommendations]
      summary: Reject a recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Rejected recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /recommendations/{id}/override:
    patch:
      operationId: overrideRecommendation
      tags: [recommendations]
      summary: Manually override recommended price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideRequest"
      responses:
        "200":
          description: Overridden recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /recommendations/bulk-approve:
    post:
      operationId: bulkApproveRecommendations
      tags: [recommendations]
      summary: Bulk approve recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIdsRequest"
      responses:
        "200":
          description: Bulk approve result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /model-runs:
    get:
      operationId: listModelRuns
      tags: [model-health]
      summary: List model runs
      responses:
        "200":
          description: Model run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelRun"

    post:
      operationId: triggerModelRun
      tags: [model-health]
      summary: Trigger a new model run
      responses:
        "200":
          description: Model run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRun"

  /model-health:
    get:
      operationId: getModelHealth
      tags: [model-health]
      summary: Get model health summary
      responses:
        "200":
          description: Model health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelHealth"

  /data-quality:
    get:
      operationId: getDataQuality
      tags: [data-quality]
      summary: Get data quality report
      responses:
        "200":
          description: Data quality issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityReport"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List import jobs
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: "Filter op bron: PriceShape, DRS, Handmatig, Paper_Copy"
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter op status uit de importlevenscyclus
        - name: upload_type
          in: query
          required: false
          schema:
            type: string
          description: Filter op importtype
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Import jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportJob"

  /uploads/products:
    post:
      operationId: uploadProducts
      tags: [uploads]
      summary: Upload product master CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/sales:
    post:
      operationId: uploadSales
      tags: [uploads]
      summary: Upload sales history CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/prices:
    post:
      operationId: uploadPrices
      tags: [uploads]
      summary: Upload own price history CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/competitor-prices:
    post:
      operationId: uploadCompetitorPrices
      tags: [uploads]
      summary: Upload competitor prices CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/inventory:
    post:
      operationId: uploadInventory
      tags: [uploads]
      summary: Upload inventory/stock CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/substitutions:
    post:
      operationId: uploadSubstitutions
      tags: [uploads]
      summary: Upload substitution mapping CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/basket-affinity:
    post:
      operationId: uploadBasketAffinity
      tags: [uploads]
      summary: Upload basket affinity CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /uploads/price-rules:
    post:
      operationId: uploadPriceRules
      tags: [uploads]
      summary: Upload min/max price rules CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /substitutions:
    get:
      operationId: listSubstitutions
      tags: [substitutions]
      summary: List A-brand/private-label substitution pairs
      responses:
        "200":
          description: Substitution pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubstitutionPair"

  /skus/{id}/history:
    get:
      operationId: getSkuHistory
      tags: [skus]
      summary: Get SKU historical data for deep dive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SKU history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuHistory"

  /exports/recommendations:
    get:
      operationId: exportRecommendations
      tags: [exports]
      summary: Export approved recommendations as CSV (prijsexport)
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: CSV export metadata/confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"

  /exports/recommendations/push-drs:
    post:
      operationId: pushRecommendationsToDrs
      tags: [exports]
      summary: Push approved recommendations directly to DRS via API
      parameters:
        - name: date
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: API-push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrsPushResult"

  /exports/history:
    get:
      operationId: getExportHistory
      tags: [exports]
      summary: List the export history (exportlog)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Export history list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportHistoryResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List intelligence signals
      parameters:
        - name: engine
          in: query
          schema:
            type: ["string", "null"]
        - name: severity
          in: query
          schema:
            type: ["string", "null"]
        - name: entity_type
          in: query
          schema:
            type: ["string", "null"]
        - name: entity_id
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: shop_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: page_size
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Signal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalListResponse"
    post:
      operationId: createSignal
      tags: [signals]
      summary: Publish an intelligence signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSignalRequest"
      responses:
        "201":
          description: Created signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSignal"

  /signals/catalog:
    get:
      operationId: getSignalCatalog
      tags: [signals]
      summary: Approved semantic functions and metric definitions
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalCatalog"

  /signals/{id}:
    get:
      operationId: getSignal
      tags: [signals]
      summary: Get one intelligence signal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSignal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /signals/{id}/dismiss:
    post:
      operationId: dismissSignal
      tags: [signals]
      summary: Dismiss an intelligence signal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dismissed signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSignal"

  /shops:
    get:
      operationId: listShops
      tags: [shops]
      summary: List shops
      responses:
        "200":
          description: Shop list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopListResponse"
    post:
      operationId: createShop
      tags: [shops]
      summary: Create a shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShopRequest"
      responses:
        "201":
          description: Created shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /copilot/status:
    get:
      operationId: getCopilotStatus
      tags: [copilot]
      summary: Copilot availability, example questions and approved functions
      responses:
        "200":
          description: Copilot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotStatus"

  /copilot/conversations:
    get:
      operationId: listCopilotConversations
      tags: [copilot]
      summary: List own copilot conversations
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CopilotConversation"
    post:
      operationId: createCopilotConversation
      tags: [copilot]
      summary: Create a new conversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotCreateConversationRequest"
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotConversation"

  /copilot/conversations/{id}:
    get:
      operationId: getCopilotConversation
      tags: [copilot]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotConversationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCopilotConversation
      tags: [copilot]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /copilot/conversations/{id}/messages:
    post:
      operationId: sendCopilotMessage
      tags: [copilot]
      summary: Ask the copilot a question (SSE stream response)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotAskRequest"
      responses:
        "200":
          description: SSE event stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string

  /copilot/model-calls:
    get:
      operationId: listCopilotModelCalls
      tags: [copilot]
      summary: AI Gateway call log (audit)
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Model call log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CopilotModelCall"


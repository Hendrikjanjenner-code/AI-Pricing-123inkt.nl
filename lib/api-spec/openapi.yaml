        "200":
          description: Aanbieders met positieverdeling binnen de scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop_id: { type: integer }
                  own_shop_name: { type: string }
                  sort: { type: string }
                  limit: { type: ["integer", "null"] }
                  items_total: { type: integer }
                  items_compared: { type: integer }
                  items_without_valid_competitor: { type: integer }
                  excluded_by_reason:
                    type: object
                    additionalProperties: { type: integer }
                  as_of_min: { type: ["string", "null"] }
                  as_of_max: { type: ["string", "null"] }
                  total_providers: { type: integer }
                  providers:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  item_detail:
                    type: ["object", "null"]
                    additionalProperties: true

  /competition/price-increase-room:

              schema:
                type: object
                properties:
                  shop_id: { type: integer }
                  run_date: { type: ["string", "null"] }
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /competition/competitor-profile/compare:
    get:
      operationId: compareCompetitorProfiles

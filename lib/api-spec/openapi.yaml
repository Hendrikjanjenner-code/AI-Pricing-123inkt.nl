          in: query
          schema: { type: ["string", "null"] }
        - name: brands
          in: query
          schema: { type: ["string", "null"] }
        - name: statuses
          in: query
          schema: { type: ["string", "null"] }
        - name: sku_query
          in: query
          schema: { type: ["string", "null"] }
        - name: safety_margin_pct
          in: query
          schema: { type: number, minimum: 0, maximum: 10, default: 1.0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Verhogingsruimte per item plus samenvatting
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop_id: { type: integer }

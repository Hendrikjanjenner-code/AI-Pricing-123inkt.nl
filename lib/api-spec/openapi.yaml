          in: query
          schema: { type: ["string", "null"] }
        - name: sort
          in: query
          description: position_asc (1→20) of position_desc (20→1)
          schema: { type: string, enum: [position_asc, position_desc], default: position_asc }
        - name: limit
          in: query
          schema: { type: ["integer", "null"], minimum: 1, maximum: 500 }

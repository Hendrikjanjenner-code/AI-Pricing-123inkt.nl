        - name: subcategory_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: sub_subcategory_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: sub_sub_subcategory_id
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Producten (server-side gefilterd en gelimiteerd)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFilterProductList"

  /product-filters/resolve-scope:
    post:
      operationId: resolveProductFilterScope
      tags: [product-filters]
      summary: Valideer de filtercombinatie en geef de effectieve scope terug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductFilterResolveScopeRequest"
      responses:
        "200":
          description: Gevalideerde scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFilterResolveScopeResponse"

components:
  schemas:
    ProductFilterNode:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: integer
        name:
          type: string
        level:
          type: integer
        path:
          type: ["string", "null"]
        path_names:
          type: ["string", "null"]

    ProductFilterNodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductFilterNode"

    ProductFilterProduct:
      type: object
      required: [sku_id, name, label]
      properties:
        sku_id:
          type: string
        name:
          type: string
        label:
          type: string

    ProductFilterProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductFilterProduct"

    ProductFilterResolveScopeRequest:
      type: object
      properties:
        main_category_id:
          type: ["integer", "null"]
        subcategory_id:
          type: ["integer", "null"]
        sub_subcategory_id:
          type: ["integer", "null"]
        sub_sub_subcategory_id:
          type: ["integer", "null"]
        sku_id:
          type: ["string", "null"]

    ProductFilterResolveScopeResponse:
      type: object
      required: [valid, levels]
      properties:
        valid:
          type: boolean
        levels:
          type: array
          items:
            $ref: "#/components/schemas/ProductFilterNode"
        product:
          oneOf:
            - $ref: "#/components/schemas/ProductFilterProduct"
            - type: "null"
        deepest_node_id:
          type: ["integer", "null"]
        breadcrumb:
          type: ["string", "null"]

    CompetitorScoreSummary:
      type: object
      required: [competitor_name, run_date]
      properties:
        competitor_name:
          type: string
        run_date:
          type: string
        company_size_class:
          type: ["string", "null"]
        company_size_confidence:
          type: ["number", "null"]
        geographic_scale_class:
          type: ["string", "null"]
        geographic_scale_confidence:
          type: ["number", "null"]
        fulfilment_model_class:
          type: ["string", "null"]
        fulfilment_model_confidence:
          type: ["number", "null"]
        operational_strength_score:
          type: ["number", "null"]
        financial_health_score:
          type: ["number", "null"]
        financial_health_status:
          type: ["string", "null"]
        financial_data_confidence:
          type: ["number", "null"]
        business_strength_score:
          type: ["number", "null"]
        procurement_power_score:
          type: ["number", "null"]
        future_threat_score:
          type: ["number", "null"]
        data_completeness_pct:
          type: ["number", "null"]
        model_version:
          type: ["string", "null"]

    CompetitorScoresList:
      type: object
      required: [shop_id, count, scores]
      properties:
        shop_id:
          type: integer
        count:
          type: integer
        scores:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorScoreSummary"

    CompetitorScoreRankings:
      type: object
      required: [shop_id, dimension, rankings, unknown]
      properties:
        shop_id:
          type: integer
        dimension:
          type: string
        rankings:
          type: array
          items:
            type: object
            required: [rank, competitor_name, score]
            properties:
              rank:
                type: integer
              competitor_name:
                type: string
              score:
                type: number
              run_date:
                type: string
              data_completeness_pct:
                type: ["number", "null"]
              details: {}
        unknown:
          type: array
          items:
            type: object
            required: [competitor_name]
            properties:
              competitor_name:
                type: string
              run_date:
                type: string
              data_completeness_pct:
                type: ["number", "null"]
              reason:
                type: ["string", "null"]

    CompetitorScoreDetail:
      allOf:
        - $ref: "#/components/schemas/CompetitorScoreSummary"
        - type: object
          properties:
            shop_id:
              type: integer
            details: {}

    CopilotCreateConversationRequest:
      type: object
      properties:
        title:
          type: ["string", "null"]

    CopilotAskRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    CopilotStatus:
      type: object
      required: [ai_available, model, example_questions, approved_functions]
      properties:
        ai_available:
          type: boolean
        model:
          type: string
        example_questions:
          type: array
          items:
            type: string
        approved_functions:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name:
                type: string
              description:
                type: string
        data_freshness:
          type: object
          additionalProperties: true

    CopilotConversation:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
        created_at:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]

    CopilotMessage:
      type: object
      required: [id, role, content]
      properties:
        id:
          type: integer
        role:
          type: string
        content:
          type: string
        answer:
          type: ["object", "null"]
          additionalProperties: true
        created_at:
          type: ["string", "null"]

    CopilotConversationDetail:
      allOf:
        - $ref: "#/components/schemas/CopilotConversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/CopilotMessage"

    CopilotModelCall:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        timestamp:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        user_role:
          type: ["string", "null"]
        conversation_id:
          type: ["integer", "null"]
        purpose:
          type: ["string", "null"]
        provider:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        functions_called:
          type: ["array", "null"]
          items:
            type: object
            additionalProperties: true
        datasources:
          type: ["array", "null"]
          items:
            type: string
        prompt_tokens:
          type: ["integer", "null"]
        completion_tokens:
          type: ["integer", "null"]
        total_tokens:
          type: ["integer", "null"]
        llm_roundtrips:
          type: ["integer", "null"]
        duration_ms:
          type: ["number", "null"]
        status:
          type: ["string", "null"]
        error_message:
          type: ["string", "null"]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string

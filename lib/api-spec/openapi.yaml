      operationId: recalculateDrsMargin
      tags: [dashboard]
      summary: Queue whole-shop recalculation for latest confirmed daily sales
      parameters:
        - name: shop_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Durable running or completed run for the same confirmed sales source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrsMarginRun" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrsApiError" }
        "403":
          description: Admin or pricing_manager role and shop access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrsApiError" }
        "404":
          description: Shop not found or inaccessible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrsApiError" }
        "409":
          description: No confirmed daily sales available for this shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrsApiError" }


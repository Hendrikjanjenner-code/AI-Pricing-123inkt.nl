          description: Geen scores voor deze concurrent in deze shop

  /competition/rankings:
    get:
      operationId: getCompetitorRankings
      tags: [competition]
      summary: Concurrentrankings met server-side profiel- en scorefilters
      parameters:
        - name: scope
          in: query
          schema: { type: string, default: overall }
        - name: shop_id
          in: query
          schema: { type: ["integer", "null"] }
        - name: company_size
          in: query
          schema: { type: ["string", "null"] }
        - name: geographic_scale
          in: query
          schema: { type: ["string", "null"] }
        - name: country
          in: query
          schema: { type: ["string", "null"] }
        - name: customer_model
          in: query
          schema: { type: ["string", "null"] }
        - name: market_role
          in: query
          schema: { type: ["string", "null"] }
        - name: fulfilment_model
          in: query
          schema: { type: ["string", "null"] }
        - name: financial_health
          in: query
          schema: { type: ["string", "null"] }
        - name: min_business_strength
          in: query
          schema: { type: ["number", "null"], minimum: 0, maximum: 100 }
        - name: min_procurement_power
          in: query
          schema: { type: ["number", "null"], minimum: 0, maximum: 100 }
        - name: min_data_completeness
          in: query
          schema: { type: ["number", "null"], minimum: 0, maximum: 100 }
        - name: hierarchy_node_ids
          in: query
          description: CSV van producthiërarchie-node-ids (descendants tellen server-side mee)
          schema: { type: ["string", "null"] }
        - name: brands
          in: query
          description: CSV van merknamen
          schema: { type: ["string", "null"] }
        - name: statuses
          in: query
          schema: { type: ["string", "null"] }
        - name: sku_query
          in: query
          schema: { type: ["string", "null"] }
        - name: limit
          in: query
          description: Top-N afkapping server-side (bv. 10/20); weglaten = alle
          schema: { type: ["integer", "null"], minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Gefilterde rankinglijst met correcte totalen
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string }
                  run_date: { type: ["string", "null"] }
                  total: { type: integer }
                  shown:
                    type: integer
                    description: Aantal geretourneerde rijen na Top-N-afkapping
                  score_basis:
                    type: string
                    description: >-
                      "overall" of "hierarchy_nodes" — bij een actieve
                      hiërarchieselectie zijn de scores node-specifiek
                      (berekend over uitsluitend descendants van de selectie).
                  unmapped_observations:
                    type: ["integer", "null"]
                    description: Waarnemingen zonder interne hiërarchie-mapping ("mapping ontbreekt")
                  nodes_used:
                    type: ["array", "null"]
                    items:
                      type: object
                      additionalProperties: true
                  rankings:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /competition/price-position:

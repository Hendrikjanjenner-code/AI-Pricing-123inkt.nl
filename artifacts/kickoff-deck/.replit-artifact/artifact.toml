kind = "slides"
previewPath = "/kickoff-deck/"
title = "AI Pricing & Commercial Intelligence Platform — Kick-off"
version = "1.0.0"
id = "artifacts/kickoff-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/kickoff-deck/" ]
localPort = 25459

[services.development]
run = "pnpm --filter @workspace/kickoff-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kickoff-deck", "run", "build" ]
publicDir = "artifacts/kickoff-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25459"
BASE_PATH = "/kickoff-deck/"

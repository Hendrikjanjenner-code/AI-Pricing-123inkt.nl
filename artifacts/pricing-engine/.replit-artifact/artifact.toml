kind = "web"
previewPath = "/"
title = "AI Pricing Decision Engine"
version = "1.0.0"
id = "artifacts/pricing-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23545

[services.development]
run = "pnpm --filter @workspace/pricing-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pricing-engine", "run", "build" ]
publicDir = "artifacts/pricing-engine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23545"
BASE_PATH = "/"
